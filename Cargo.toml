[workspace]
members = [".", "crates/yaml-schema-wasm"]

[package]
name = "yaml-schema"
version = "0.9.3"
edition = "2024"
description = "A YAML schema validator"
license = "MIT"
repository = "https://github.com/yaml-schema/yaml-schema"
documentation = "https://docs.rs/yaml-schema"
readme = "README.md"
homepage = "https://github.com/yaml-schema/yaml-schema"
exclude = [
    ".github/*"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.8", features = ["cargo", "derive"] }
env_logger = "0.11.11"
eyre = "0.6.14"
hashlink = "0.12.2"
jsonptr = "0.8.2"
log = "0.4.35"
ordered-float = "5.5.1"
regex = "1.10.4"
saphyr = "0.3.4"
serde_json = "~1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

# reqwest's blocking client (and its rustls/ring/tokio stack) doesn't build for wasm32, so
# remote $ref/$schema fetching is native-only; see loader::fetch_url.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls"], default-features = false }
# Direct pin so the lockfile never resolves below the fix for Dependabot alert #12 (rustls >= 0.23.45).
# Native-only: rustls pulls in aws-lc-sys (C code) which does not build for wasm32.
rustls = "0.23.46"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
boon = "0.6.1"
criterion = "0.8.2"
ctor = "1.0.14"
cucumber = "0.23.0"
serde_json = "~1.0"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }

[[test]]
name = "features"
harness = false

[lints.clippy]
unwrap_used = "deny"

[[bench]]
name = "ys_vs_boon"
harness = false
