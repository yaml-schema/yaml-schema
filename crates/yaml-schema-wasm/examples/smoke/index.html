<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>yaml-schema-wasm — smoke test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f4f6f5;
    --panel: #ffffff;
    --text: #171b1e;
    --muted: #5c6670;
    --border: #dde3e6;
    --good: #2f8f5d;
    --good-soft: #e6f4ec;
    --bad: #c03f2c;
    --bad-soft: #fbe9e5;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --panel: #1a1f26;
      --text: #e7ebee;
      --muted: #8793a0;
      --border: #262c34;
      --good: #5fbf8d;
      --good-soft: #163526;
      --bad: #e2705d;
      --bad-soft: #3a1f1a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
  body { padding: 2.5rem 1rem 4rem; }
  .page { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
  h1 { font-size: 1.6rem; margin: 0; font-weight: 650; }
  .dek { margin: 0.4rem 0 0; color: var(--muted); line-height: 1.5; }
  .summary { font-family: var(--font-mono); font-size: 0.9rem; }
  .summary.pass { color: var(--good); }
  .summary.fail { color: var(--bad); }

  .case {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.5rem;
  }
  .case header { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .case h2 { font-size: 1rem; margin: 0; font-weight: 600; }
  .case code.call { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
  .badge {
    margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
    padding: 0.15rem 0.5rem; border-radius: 999px;
  }
  .badge.pass { background: var(--good-soft); color: var(--good); }
  .badge.fail { background: var(--bad-soft); color: var(--bad); }
  pre {
    margin: 0; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; color: var(--muted);
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>yaml-schema-wasm smoke test</h1>
    <p class="dek">
      Runs <code>validate()</code>, <code>validateSchema()</code> and <code>version()</code> from the
      <code>wasm-pack</code> build against fixed inputs, and checks each result's shape.
    </p>
  </header>
  <div id="summary" class="summary">Loading wasm…</div>
  <div id="cases"></div>
</main>

<script type="module">
  import init, { validate, validateSchema, version } from "../../pkg/yaml_schema_wasm.js";

  const PERSON_SCHEMA = `type: object
properties:
  name:
    type: string
  age:
    type: integer
    minimum: 0
required:
  - name
`;

  const REF_SCHEMA = `$defs:
  name:
    type: string
type: object
properties:
  name:
    $ref: "#/$defs/name"
`;

  const REMOTE_REF_SCHEMA = `type: object
properties:
  name:
    $ref: "https://yaml-schema.net/yaml-schema.yaml#/$defs/valid_types"
`;

  const CASES = [
    {
      title: "Valid document",
      call: "validate(PERSON_SCHEMA, 'name: Alice\\nage: 30')",
      run: () => validate(PERSON_SCHEMA, "name: Alice\nage: 30\n"),
      check: (r) => r.valid && r.errors.length === 0 && r.fatal === undefined,
    },
    {
      title: "Invalid document reports 1-based line/col",
      call: "validate(PERSON_SCHEMA, 'name: Alice\\nage: -1')",
      run: () => validate(PERSON_SCHEMA, "name: Alice\nage: -1\n"),
      check: (r) => !r.valid && r.errors.length === 1 && r.errors[0].path === "age"
        && r.errors[0].line === 2 && r.errors[0].col === 6,
    },
    {
      title: "failFast stops at the first error",
      call: "validate(PERSON_SCHEMA, 'age: -1', { failFast: true })",
      run: () => validate(PERSON_SCHEMA, "age: -1\n", { failFast: true }),
      check: (r) => !r.valid && r.errors.length === 1,
    },
    {
      title: "Schema YAML syntax error → fatal.phase = schema",
      call: "validate('type: [object', 'name: Alice')",
      run: () => validate("type: [object\n", "name: Alice\n"),
      check: (r) => !r.valid && r.fatal?.phase === "schema" && typeof r.fatal.line === "number",
    },
    {
      title: "Document YAML syntax error → fatal.phase = document",
      call: "validate(PERSON_SCHEMA, 'name: [Alice')",
      run: () => validate(PERSON_SCHEMA, "name: [Alice\n"),
      check: (r) => !r.valid && r.fatal?.phase === "document" && typeof r.fatal.line === "number",
    },
    {
      title: "Internal $ref",
      call: "validate(REF_SCHEMA, 'name: 42')",
      run: () => validate(REF_SCHEMA, "name: 42\n"),
      check: (r) => !r.valid && r.errors.length === 1 && r.fatal === undefined,
    },
    {
      title: "Remote $ref is unsupported → fatal.phase = validation",
      call: "validate(REMOTE_REF_SCHEMA, 'name: string')",
      run: () => validate(REMOTE_REF_SCHEMA, "name: string\n"),
      check: (r) => !r.valid && r.fatal?.phase === "validation"
        && r.fatal.message.includes("not supported in the WebAssembly build"),
    },
    {
      title: "validateSchema: valid schema",
      call: "validateSchema(PERSON_SCHEMA)",
      run: () => validateSchema(PERSON_SCHEMA),
      check: (r) => r.valid,
    },
    {
      title: "validateSchema: invalid schema",
      call: "validateSchema('type: object\\nminProperties: lots')",
      run: () => validateSchema("type: object\nminProperties: lots\n"),
      check: (r) => !r.valid && r.errors.length > 0,
    },
    {
      title: "version()",
      call: "version()",
      run: () => version(),
      check: (v) => /^\d+\.\d+\.\d+/.test(v),
    },
  ];

  function renderCase({ title, call }, passed, output) {
    const el = document.createElement("section");
    el.className = "case";
    const header = document.createElement("header");
    const h2 = document.createElement("h2");
    h2.textContent = title;
    const code = document.createElement("code");
    code.className = "call";
    code.textContent = call;
    const badge = document.createElement("span");
    badge.className = `badge ${passed ? "pass" : "fail"}`;
    badge.textContent = passed ? "PASS" : "FAIL";
    header.append(h2, code, badge);
    const pre = document.createElement("pre");
    pre.textContent = output;
    el.append(header, pre);
    return el;
  }

  const summaryEl = document.getElementById("summary");
  const casesEl = document.getElementById("cases");
  casesEl.style.cssText = "display: flex; flex-direction: column; gap: 0.75rem;";

  try {
    await init();
  } catch (e) {
    summaryEl.className = "summary fail";
    summaryEl.textContent = `Failed to load wasm: ${e}. Did you run wasm-pack build?`;
    throw e;
  }

  let failures = 0;
  for (const testCase of CASES) {
    let passed = false;
    let output;
    try {
      const result = testCase.run();
      passed = Boolean(testCase.check(result));
      output = typeof result === "string" ? result : JSON.stringify(result, null, 2);
    } catch (e) {
      output = `threw: ${e}`;
    }
    if (!passed) failures += 1;
    casesEl.append(renderCase(testCase, passed, output));
  }

  const total = CASES.length;
  summaryEl.className = `summary ${failures === 0 ? "pass" : "fail"}`;
  summaryEl.textContent = failures === 0
    ? `All ${total} checks passed (yaml-schema v${version()})`
    : `${failures} of ${total} checks failed`;
  document.body.dataset.result = failures === 0 ? "pass" : "fail";
</script>
</body>
</html>
