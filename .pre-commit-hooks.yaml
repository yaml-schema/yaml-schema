- id: ys
  name: ys (yaml-schema)
  description: Validate YAML files against a YAML Schema
  entry: >-
    bash -c '
    opts=(); files=();
    while [ $# -gt 0 ]; do
      case "$1" in
        -f|--schema) opts+=("$1" "$2"); shift 2 ;;
        -*) opts+=("$1"); shift 1 ;;
        *) files+=("$1"); shift 1 ;;
      esac
    done;
    for f in "${files[@]}"; do
      ys "${opts[@]}" "$f" || exit 1;
    done' --
  language: rust
  types: [yaml]
