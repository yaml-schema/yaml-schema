$schema: https://yaml-schema.net/yaml-schema.yaml
title: Kustomization
description: >-
  Schema for kustomize's kustomization.yaml, converted from
  https://json.schemastore.org/kustomization.json
$ref: "#/$defs/Kustomization"
$defs:
  ConfigMapArgs:
    description: ConfigMapArgs contains the metadata of how to generate a configmap
    type: object
    additionalProperties: false
    properties:
      KVSources:
        type: array
        items:
          $ref: "#/$defs/KVSource"
      behavior:
        enum:
          - create
          - replace
          - merge
      env:
        description: "Deprecated.  Use envs instead."
        type: string
      envs:
        description: A list of file paths. The contents of each file should be one key=value pair per line
        type: array
        items:
          type: string
      files:
        description: A list of file sources to use in creating a list of key, value pairs
        type: array
        items:
          type: string
      literals:
        description: "A list of literal pair sources. Each literal source should be a key and literal value, e.g. `key=value`"
        type: array
        items:
          type: string
      name:
        description: Name - actually the partial name - of the generated resource
        type: string
      namespace:
        description: Namespace for the configmap, optional
        type: string
      options:
        $ref: "#/$defs/GeneratorOptions"

  FieldSelector:
    description: Contains the fieldPath to an object field
    type: object
    additionalProperties: false
    properties:
      fieldpath:
        type: string

  FieldSpec:
    type: object
    properties:
      create:
        type: boolean
      group:
        type: string
      kind:
        type: string
      path:
        type: string
      version:
        type: string

  GeneratorOptions:
    description: GeneratorOptions modify behavior of all ConfigMap and Secret generators
    type: object
    additionalProperties: false
    properties:
      annotations:
        description: Annotations to add to all generated resources
        type: object
        patternProperties:
          ".*":
            type: string
      disableNameSuffixHash:
        description: DisableNameSuffixHash if true disables the default behavior of adding a suffix to the names of generated resources that is a hash of the resource contents
        type: boolean
      immutable:
        description: Immutable if true add to all generated resources
        type: boolean
      labels:
        description: Labels to add to all generated resources
        type: object
        patternProperties:
          ".*":
            type: string

  HelmChart:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      version:
        type: string
      repo:
        type: string
      releaseName:
        type: string
      namespace:
        type: string
      valuesFile:
        type: string
      valuesInline:
        type: object
        additionalProperties: true
      valuesMerge:
        type: string
        enum:
          - merge
          - override
          - replace
      includeCRDs:
        type: boolean
      skipHooks:
        type: boolean
      additionalValuesFiles:
        type: array
        items:
          type: string
      skipTests:
        type: boolean
      apiVersions:
        type: array
        items:
          type: string
      kubeVersion:
        type: string
      nameTemplate:
        type: string

  Image:
    type: object
    additionalProperties: false
    properties:
      digest:
        type: string
      name:
        type: string
      newName:
        type: string
      newTag:
        type: string
      tagSuffix:
        description: UNDOCUMENTED.
        type: string

  Inventory:
    description: Inventory appends an object that contains the record of all other objects, which can be used in apply, prune and delete
    type: object
    additionalProperties: false
    properties:
      configMap:
        $ref: "#/$defs/NameArgs"
      type:
        type: string

  KVSource:
    type: object
    additionalProperties: false
    properties:
      args:
        type: array
        items:
          type: string
      name:
        type: string
      pluginType:
        type: string

  Kustomization:
    type: object
    additionalProperties: false
    properties:
      apiVersion:
        type: string
      bases:
        description: DEPRECATED. Bases are relative paths or git repository URLs specifying a directory containing a kustomization.yaml file.
        type: array
        items:
          type: string
      commonAnnotations:
        description: CommonAnnotations to add to all objects
        type: object
        patternProperties:
          ".*":
            type: string
      buildMetadata:
        description: BuildMetadata is a list of strings used to toggle different build options
        type: array
        items:
          type: string
      commonLabels:
        description: CommonLabels to add to all objects and selectors
        type: object
        patternProperties:
          ".*":
            type: string
      configMapGenerator:
        description: ConfigMapGenerator is a list of configmaps to generate from local data (one configMap per list item)
        type: array
        items:
          $ref: "#/$defs/ConfigMapArgs"
      configurations:
        description: Configurations is a list of transformer configuration files
        type: array
        items:
          type: string
      crds:
        description: >-
          Crds specifies relative paths to Custom Resource Definition files.
          This allows custom resources to be recognized as operands, making it
          possible to add them to the Resources list. CRDs themselves are not
          modified.
        type: array
        items:
          type: string
      generatorOptions:
        $ref: "#/$defs/GeneratorOptions"
      generators:
        description: Generators is a list of files containing custom generators
        type: array
        items:
          type: string
      helmCharts:
        description: HelmCharts is a list of helm chart configuration instances
        type: array
        items:
          $ref: "#/$defs/HelmChart"
      helmGlobals:
        description: HelmGlobals contains helm configuration that isn't chart specific
        type: object
        additionalProperties: false
        properties:
          chartHome:
            description: ChartHome is a file path, relative to the kustomization root, to a directory containing a subdirectory for each chart to be included in the kustomization
            type: string
          configHome:
            description: ConfigHome defines a value that kustomize should pass to helm via the HELM_CONFIG_HOME environment variable
            type: string
      images:
        description: >-
          Images is a list of (image name, new name, new tag or digest) for
          changing image names, tags or digests. This can also be achieved
          with a patch, but this operator is simpler to specify.
        type: array
        items:
          $ref: "#/$defs/Image"
      inventory:
        description: Contains metadata about a Resource
        $ref: "#/$defs/Inventory"
      labels:
        description: Labels to add to all objects but not selectors
        type: array
        items:
          $ref: "#/$defs/Labels"
      kind:
        type: string
      metadata:
        description: Contains metadata about a Resource
        $ref: "#/$defs/Metadata"
      namePrefix:
        description: NamePrefix will prefix the names of all resources mentioned in the kustomization file including generated configmaps and secrets
        type: string
      nameSuffix:
        description: NameSuffix will suffix the names of all resources mentioned in the kustomization file including generated configmaps and secrets
        type: string
      namespace:
        description: Namespace to add to all objects
        type: string
      replacements:
        description: Substitute field(s) in N target(s) with a field from a source
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/ReplacementsPath"
            - $ref: "#/$defs/ReplacementsInline"
      openapi:
        description: OpenAPI contains information about what kubernetes schema to use
        type: object
        patternProperties:
          ".*":
            type: string
      patches:
        description: Apply a patch to multiple resources
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/PatchesPatchPath"
            - $ref: "#/$defs/PatchesInlinePatch"
      patchesJson6902:
        description: JSONPatches is a list of JSONPatch for applying JSON patch. See http://jsonpatch.com
        type: array
        items:
          $ref: "#/$defs/PatchJson6902"
      patchesStrategicMerge:
        description: PatchesStrategicMerge specifies the relative path to a file containing a strategic merge patch. URLs and globs are not supported
        type: array
        items:
          type: string
      replicas:
        description: >-
          Replicas is a list of (resource name, count) for changing number of
          replicas for a resources. It will match any group and kind that has
          a matching name and that is one of: Deployment,
          ReplicationController, Replicaset, Statefulset.
        type: array
        items:
          $ref: "#/$defs/Replicas"
      resources:
        description: Resources specifies relative paths to files holding YAML representations of kubernetes API objects. URLs and globs not supported.
        type: array
        items:
          type: string
      components:
        description: Components are relative paths or git repository URLs specifying a directory containing a kustomization.yaml file of Kind Component.
        type: array
        items:
          type: string
      secretGenerator:
        description: SecretGenerator is a list of secrets to generate from local data (one secret per list item)
        type: array
        items:
          $ref: "#/$defs/SecretArgs"
      sortOptions:
        description: sortOptions is used to sort the resources kustomize outputs
        oneOf:
          - type: object
            additionalProperties: false
            properties:
              order:
                const: legacy
              legacySortOptions:
                type: object
                additionalProperties: false
                properties:
                  orderFirst:
                    type: array
                  orderLast:
                    type: array
          - type: object
            additionalProperties: false
            properties:
              order:
                const: fifo
      transformers:
        description: Transformers is a list of files containing transformers
        type: array
        items:
          type: string
      validators:
        description: Validators is a list of files containing validators
        type: array
        items:
          type: string
      vars:
        description: >-
          Allows things modified by kustomize to be injected into a container
          specification. A var is a name (e.g. FOO) associated with a field
          in a specific resource instance. The field must contain a value of
          type string, and defaults to the name field of the instance
        type: array
        items:
          $ref: "#/$defs/Var"

  Labels:
    type: object
    additionalProperties: false
    properties:
      pairs:
        description: Pairs contains the key-value pairs for labels to add
        type: object
        patternProperties:
          ".*":
            type: string
      includeSelectors:
        description: IncludeSelectors indicates should transformer include the fieldSpecs for selectors
        type: boolean
      includeTemplates:
        description: IncludeTemplates indicates should transformer include the template labels
        type: boolean
      fields:
        description: FieldSpec completely specifies a kustomizable field in a k8s API object. It helps define the operands of transformations
        type: array
        items:
          $ref: "#/$defs/FieldSpec"

  Metadata:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      namespace:
        type: string
      labels:
        type: object
        patternProperties:
          ".*":
            type: string
      annotations:
        type: object
        patternProperties:
          ".*":
            type: string

  NameArgs:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      namespace:
        type: string

  PatchJson6902:
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - path
          - target
        properties:
          path:
            description: relative file path for a json patch file inside a kustomization
            type: string
          target:
            description: Refers to a Kubernetes object that the json patch will be applied to. It must refer to a Kubernetes resource under the purview of this kustomization
            $ref: "#/$defs/PatchTarget"
      - type: object
        additionalProperties: false
        required:
          - patch
          - target
        properties:
          patch:
            description: inline json patch
            type: string
          target:
            description: Refers to a Kubernetes object that the json patch will be applied to. It must refer to a Kubernetes resource under the purview of this kustomization
            $ref: "#/$defs/PatchTarget"
      - type: object
        additionalProperties: false
        required:
          - op
          - path
        properties:
          op:
            description: The operation
            type: string
            enum:
              - add
              - remove
              - replace
              - move
              - copy
              - test
          from:
            description: The source location.
            type: string
          path:
            description: The target location.
            type: string
          value:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string

  PatchTarget:
    type: object
    additionalProperties: false
    required:
      - kind
      - name
      - version
    properties:
      group:
        type: string
      kind:
        type: string
      name:
        type: string
      namespace:
        type: string
      version:
        type: string

  PatchesOptions:
    type: object
    additionalProperties: false
    properties:
      allowNameChange:
        type: boolean
      allowKindChange:
        type: boolean

  PatchesPatchPath:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      options:
        $ref: "#/$defs/PatchesOptions"
      path:
        type: string
      target:
        description: Refers to a Kubernetes object that the patch will be applied to. It must refer to a Kubernetes resource under the purview of this kustomization
        $ref: "#/$defs/Selector"

  PatchesInlinePatch:
    type: object
    additionalProperties: false
    required:
      - patch
    properties:
      options:
        $ref: "#/$defs/PatchesOptions"
      patch:
        type: string
      target:
        description: Refers to a Kubernetes object that the patch will be applied to. It must refer to a Kubernetes resource under the purview of this kustomization
        $ref: "#/$defs/Selector"

  ReplacementsInline:
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - source
          - targets
        properties:
          source:
            $ref: "#/$defs/ReplacementsSource"
          targets:
            description: The N fields to write the value to
            type: array
            items:
              $ref: "#/$defs/ReplacementsTarget"
      - type: object
        additionalProperties: false
        required:
          - sourceValue
          - targets
        properties:
          sourceValue:
            description: A scalar value as source
            type: string
          targets:
            description: The N fields to write the value to
            type: array
            items:
              $ref: "#/$defs/ReplacementsTarget"

  ReplacementsPath:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        type: string

  ReplacementsSource:
    description: The source of the value
    type: object
    properties:
      group:
        description: The group of the referent
        type: string
      version:
        description: The version of the referent
        type: string
      kind:
        description: The kind of the referent
        type: string
      name:
        description: The name of the referent
        type: string
      namespace:
        description: The namespace of the referent
        type: string
      fieldPath:
        description: The structured path to the source value
        type: string
      options:
        type: object
        properties:
          delimiter:
            type: string
          index:
            type: number
          create:
            type: boolean

  ReplacementsTarget:
    type: object
    required:
      - select
    properties:
      select:
        description: Include objects that match this
        $ref: "#/$defs/Selector"
      reject:
        description: Exclude objects that match this
        type: array
        items:
          $ref: "#/$defs/Selector"
      fieldPaths:
        description: The structured path(s) to the target nodes
        type: array
        items:
          description: The structured path to the source value
          type: string
      options:
        type: object
        properties:
          delimiter:
            type: string
          index:
            type: number
          create:
            type: boolean

  Replicas:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      count:
        type: number

  SecretArgs:
    description: SecretArgs contains the metadata of how to generate a secret
    type: object
    additionalProperties: false
    properties:
      KVSources:
        type: array
        items:
          $ref: "#/$defs/KVSource"
      behavior:
        enum:
          - create
          - replace
          - merge
      env:
        type: string
      envs:
        type: array
        items:
          type: string
      files:
        type: array
        items:
          type: string
      literals:
        type: array
        items:
          type: string
      name:
        description: Name - actually the partial name - of the generated resource
        type: string
      namespace:
        description: Namespace for the secret, optional
        type: string
      options:
        $ref: "#/$defs/GeneratorOptions"
      type:
        description: Type of the secret, optional
        type: string

  Selector:
    description: >-
      Selector specifies a set of resources.
      Any resource that matches intersection of all conditions is included in this set.
    type: object
    additionalProperties: false
    properties:
      group:
        description: The group of the referent
        type: string
      kind:
        description: The kind of the referent
        type: string
      name:
        description: The name of the referent
        type: string
      namespace:
        description: The namespace of the referent
        type: string
      version:
        description: The version of the referent
        type: string
      annotationSelector:
        description: >-
          AnnotationSelector is a string that follows the label selection expression
          https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#api
        type: string
      labelSelector:
        description: >-
          LabelSelector is a string that follows the label selection expression
          https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#api
        type: string

  Target:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      apiVersion:
        type: string
      group:
        type: string
      kind:
        type: string
      name:
        type: string
      namespace:
        description: UNDOCUMENTED.
        type: string
      version:
        type: string

  Var:
    description: Represents a variable whose value will be sourced from a field in a Kubernetes object.
    type: object
    additionalProperties: false
    required:
      - name
      - objref
    properties:
      fieldref:
        description: Refers to the field of the object referred to by objref whose value will be extracted for use in replacing $(FOO)
        $ref: "#/$defs/FieldSelector"
      name:
        description: Value of identifier name e.g. FOO used in container args, annotations, Appears in pod template as $(FOO)
        type: string
      objref:
        description: Refers to a Kubernetes resource under the purview of this kustomization
        $ref: "#/$defs/Target"
